# Isolated local test environment. Never point these fixtures at a work server.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluentlab
      POSTGRES_USER: fluentlab
      POSTGRES_PASSWORD: local-fixture-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentlab"]
      interval: 2s
      timeout: 3s
      retries: 30
  mattermost:
    image: mattermost/mattermost-team-edition:11.10.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://fluentlab:local-fixture-only@db:5432/fluentlab?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:18065
      MM_SERVICESETTINGS_ENABLELOCALMODE: 'true'
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: 'false'
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: 'false'
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
      MM_DIAGNOSTICSETTINGS_ENABLEDIAGNOSTICS: 'false'
